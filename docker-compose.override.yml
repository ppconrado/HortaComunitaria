services:
  backend:
    build: ./backend
    ports: ['3000:3000']
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/horta-comunitaria
      MQTT_BROKER: mqtt://test.mosquitto.org:1883
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        ['CMD', 'mosquitto_pub', '-h', 'localhost', '-t', 'healthcheck', '-n']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports: ['8080:80']
    depends_on:
      - backend

volumes:
  mongo_data:
