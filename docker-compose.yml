services:
  backend:
    build: ./backend
    ports: ['3000:3000']
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/horta-comunitaria
      MQTT_BROKER: mqtt://mosquitto:1883
    depends_on: [mongo, mosquitto]
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ['1883:1883']
    volumes: [./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf]
  web:
    build: .
    ports: ['8080:80']
    depends_on: [backend]
volumes:
  mongo_data:
